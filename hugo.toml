baseURL = "https://nav.gdaox.top/"
locale = "zh-cn"
title = "任推邦团队邀请说明 · 恒学斋"
theme = "PaperMod"
timeZone = "Asia/Shanghai"
enableRobotsTXT = true
# 主动精简（非兼容补丁）：本站只有首页 + 关于页，不生成 RSS 与空分类/标签页，
# sitemap 只保留 2 条 URL。已验证官方最新版 PaperMod 不加此项也能在 Hugo 0.166 原生构建。
disableKinds = ["RSS", "taxonomy", "term"]
taxonomies = {}

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]

# 首页由 layouts/index.html 渲染，不是 Markdown 内联 HTML。
# 保持 Goldmark 默认 unsafe=false：既不丢原始 HTML，也不开放注入面。
[markup.goldmark.renderer]
  unsafe = false

[params]
  description = "任推邦推广团队合作与邀请方式的第三方说明页，含推广合作信息；非官方、非招聘、不作收益承诺"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = false
  ShowToc = false
  disableSpecial1stPost = true
  disableScrollToTop = false
  defaultTheme = "auto"
  homeInfoParams = { Title = "推广团队合作与邀请说明", Content = "说明团队邀请的合作方式、适用人群与规则边界。本页为第三方推广合作信息，含推广链接，非平台官方页面、非招聘、不作收益承诺。" }
  socialIcons = []

[params.assets]
  disableHLJS = true

# Cloudflare Web Analytics 首期不接：PaperMod 不自带注入点，仅填 siteToken 不会生效。
# 若以后要开，需同时从主博客移植 layouts/partials/extend_head.html（该 token 为公开字符串，非密钥）。

[[menu.main]]
  name = "首页"
  url = "/"
  weight = 1
[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 2

[sitemap]
  changefreq = "weekly"
  priority = 0.5
