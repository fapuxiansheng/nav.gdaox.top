{{ $cta := hugo.Data.invite.cta }}
{{ $pending := eq $cta.url "REPLACE_WITH_INVITE_URL" }}
<section class="invite-cta">
  <h2>{{ $cta.label }}</h2>
  <p class="invite-note">{{ $cta.note }}</p>
  {{ if $pending }}
  <span class="invite-btn invite-btn-pending">入口待开放</span>
  {{ else }}
  <a class="invite-btn" href="{{ $cta.url }}" target="_blank" rel="sponsored nofollow noopener">{{ $cta.action }}</a>
  <p class="invite-code">本站专属邀请码：<strong>{{ $cta.code }}</strong><span class="invite-code-hint">若上方链接打不开，可在注册页手动填写该邀请码</span></p>
  {{ end }}
  <p class="invite-verify">链接核对：{{ $cta.verify }}</p>
</section>
